<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cryptee.io – Encryption/Decryption</title>
  <!-- Load Trezor Connect v9 -->
  <script src="https://connect.trezor.io/9/trezor-connect.js"></script>
  <script src="./dist/bundle.js"></script>

  <style>
    body { font-family: sans-serif; padding: 1rem; max-width: 600px; margin: auto; }
    label { display: block; margin-top: 1rem; }
    input, textarea { width: 100%; padding: 0.5rem; font-size: 1rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    .section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem; }
    .section h2 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Cryptee.io – Encrypt / Decrypt Demo</h1>
  <p>
    Demonstrates local encryption/decryption using your Trezor device.  
    Make sure Trezor Bridge is running and your device is connected.  
  </p>

  <div class="section">
    <h2>1. Encode & Encrypt</h2>
    <label for="plaintextInput">Plaintext to Encrypt:</label>
    <textarea id="plaintextInput" rows="4" placeholder="Enter text to encrypt"></textarea>

    <label for="encryptKey">Key:</label>
    <input id="encryptKey" type="text" placeholder="Enter key for encryption">

    <button id="encryptBtn">Encode & Encrypt</button>

    <label for="encryptedOutput">Encrypted Hex Output:</label>
    <textarea id="encryptedOutput" rows="4" readonly placeholder="Encrypted text will appear here"></textarea>
  </div>

  <div class="section">
    <h2>2. Decode & Decrypt</h2>
    <label for="encryptedInput">Encrypted Hex Input:</label>
    <textarea id="encryptedInput" rows="4" placeholder="Enter hex text to decrypt"></textarea>

    <label for="decryptKey">Key:</label>
    <input id="decryptKey" type="text" placeholder="Enter key for decryption">

    <button id="decryptBtn">Decode & Decrypt</button>

    <label for="decryptedOutput">Decrypted Plaintext Output:</label>
    <textarea id="decryptedOutput" rows="4" readonly placeholder="Decrypted text will appear here"></textarea>
  </div>
</body>
</html>
